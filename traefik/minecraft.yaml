tcp:
  routers:
    minecraft:
      entryPoints:
        - minecraft
      rule: "HostSNI(`*`)"
      service: minecraft
  services:
    minecraft:
      loadBalancer:
        servers:
          # NAS traefik node (tag:home-infra). During a NAS outage this single
          # line moves to a temporary Minecraft host — see mc-temp/README.md.
          - address: "100.102.3.49:25565"
