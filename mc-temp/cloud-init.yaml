#cloud-config
package_update: true
packages:
  - git
  - ca-certificates

write_files:
  # Secrets staged outside the repo dir (write_files runs before the clone in
  # runcmd; staging here avoids colliding with the not-yet-cloned directory).
  - path: /root/mc-temp.env
    permissions: "0600"
    content: |
      TS_AUTHKEY_ADMIN=tskey-auth-REPLACE_ME
      RCON_PASSWORD=REPLACE_ME

runcmd:
  - git clone https://github.com/mcmehrtens/vps-relay.git /root/vps-relay
  - mv /root/mc-temp.env /root/vps-relay/mc-temp/.env
  - chmod 600 /root/vps-relay/mc-temp/.env
  - bash /root/vps-relay/mc-temp/bootstrap.sh 2>&1 | tee /var/log/bootstrap.log
